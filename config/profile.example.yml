# house-ops User Profile (Generic Template)
# During onboarding, the country-specific version (profile.{country}.example.yml)
# is copied to config/profile.yml and filled in with your details.
# profile.yml is in the USER LAYER — it will never be overwritten by system updates.
#
# Available countries: tw (Taiwan), ie (Ireland), th (Thailand)

country: ""                            # REQUIRED: tw | ie | th

user:
  name: ""
  commute_origin: ""
  commute_max_minutes: 45

search:
  mode: rent                        # rent | buy | both
  buyer_type: renter                # See country config for available buyer types

budget:
  rent_max: null                    # Monthly rent ceiling (local currency)
  buy_max: null                     # Total purchase price ceiling
  monthly_payment_max: null         # Max monthly mortgage payment

finance:
  savings: null                     # Available for down payment

current_property:                   # For upgraders/movers only
  estimated_value: null
  loan_remaining: null
  purchase_year: null
  selling_strategy: sell_first

property:
  size_min: null                    # Minimum size (country-specific unit)
  size_max: null
  types:
    include: []
    exclude: []
  parking: optional
  pet: false

regions: []                         # See country config for region structure

lifestyle:
  transport_walk_max: 15
  priorities: []

narrative:
  deal_breakers: []
  nice_to_have: []
  notes: ""
