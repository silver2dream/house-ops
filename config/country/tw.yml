# Taiwan Country Configuration — tw-house-ops
# All country-specific content extracted from mode files into structured YAML.
# This file is part of the SYSTEM LAYER and may be updated by system updates.

meta:
  code: tw
  name: Taiwan
  name_local: "台灣"
  language: zh-TW

market:
  currency: TWD
  currency_symbol: "NT$"
  area_unit: ping
  area_unit_symbol: "坪"
  area_to_sqm: 3.3058
  price_per_area_label: "/坪"
  rent_period_label: "/月"

regions:
  structure: "city > district (市/縣 > 區/鄉/鎮). Portals use numeric region codes."
  region_codes:
    - city: "台北市"
      code: 1
    - city: "新北市"
      code: 2
    - city: "桃園市"
      code: 3
    - city: "台中市"
      code: 5
    - city: "台南市"
      code: 15
    - city: "高雄市"
      code: 17

property_types:
  include:
    - key: apartment
      name_local: "公寓"
      name_en: "Walk-up apartment (no elevator)"
    - key: mansion
      name_local: "華廈"
      name_en: "Low-rise with elevator"
    - key: building
      name_local: "大樓"
      name_en: "High-rise building"
    - key: townhouse
      name_local: "透天"
      name_en: "Townhouse / detached"
    - key: studio
      name_local: "套房"
      name_en: "Studio"
  exclude:
    - name_local: "預售屋"
      name_en: "Pre-sale / off-plan"
    - name_local: "店面"
      name_en: "Shopfront / commercial"
    - name_local: "辦公室"
      name_en: "Office"
    - name_local: "車位"
      name_en: "Parking space (standalone)"
    - name_local: "工業用"
      name_en: "Industrial"

mortgage:
  scenarios:
    - key: youth_20
      name: "青安貸款 20%"
      name_local: "青安貸款 20%"
      name_en: "Youth Housing Loan 20% down"
      rate: 1.775
      down_payment: 0.20
      term_years: 30
      eligibility: "age <= 40, no existing property ownership, first-time buyer"
      max_loan: 8000000  # NT$8M
    - key: youth_30
      name: "青安貸款 30%"
      name_local: "青安貸款 30%"
      name_en: "Youth Housing Loan 30% down"
      rate: 1.775
      down_payment: 0.30
      term_years: 30
      eligibility: "age <= 40, no existing property ownership, first-time buyer"
      max_loan: 8000000
    - key: standard_20
      name: "一般貸款 20%"
      name_local: "一般貸款 20%"
      name_en: "Standard mortgage 20% down"
      rate: 2.1
      down_payment: 0.20
      term_years: 30
      eligibility: null
      max_loan: null
    - key: standard_30
      name: "一般貸款 30%"
      name_local: "一般貸款 30%"
      name_en: "Standard mortgage 30% down"
      rate: 2.1
      down_payment: 0.30
      term_years: 30
      eligibility: null
      max_loan: null
  affordability:
    income_field: "finance.monthly_income"
    income_period: monthly
    payment_ceiling_pct: 30
    income_multiple: null
  buyer_types:
    - key: renter
      name_local: "租屋族"
      name_en: "Renter"
    - key: first_time
      name_local: "首購族"
      name_en: "First-time buyer"
    - key: upgrader
      name_local: "換屋族"
      name_en: "Upgrader / mover"

government_schemes:
  - key: youth_loan
    name_local: "青安貸款"
    name_en: "Youth Housing Loan"
    description: "Subsidised mortgage rate for first-time buyers age 40 or under with no existing property."
    rate: 1.775
    max_loan: 8000000
    eligibility: "age <= 40, no existing property ownership, first-time buyer"
    profile_field: "finance.youth_loan_eligible"

taxes:
  capital_gains:
    name_local: "房地合一稅"
    name_en: "Consolidated Housing and Land Transaction Income Tax"
    holding_periods:
      - max_years: 2
        rate: 45
        label_local: "未滿2年"
        label_en: "Under 2 years"
      - max_years: 5
        rate: 35
        label_local: "2至5年"
        label_en: "2-5 years"
      - max_years: 10
        rate: 20
        label_local: "5至10年"
        label_en: "5-10 years"
      - max_years: null
        rate: 15
        label_local: "超過10年"
        label_en: "Over 10 years"
    self_occupied:
      rate: 10
      condition: "2+ years registered residence at the property"
      label_local: "自住（設籍滿2年）"
      label_en: "Self-occupied (2+ years residence)"
    default_gain_assumption: 0.10  # Assume gain = estimated_value * 10% if purchase price unknown
  stamp_duty: null  # No separate stamp duty in Taiwan
  property_tax:
    description: "房屋稅 (annual) + 地價稅 (annual). Rates vary by assessed value and use type."
    name_local: "房屋稅 + 地價稅"
    name_en: "House tax + Land value tax"
  transaction_costs:
    estimate_pct: 6
    breakdown:
      - item_local: "仲介費"
        item_en: "Agent commission"
        typical_pct: "1-4%"
      - item_local: "代書費"
        item_en: "Land administrator (scrivener) fee"
        typical_pct: "~0.5%"
      - item_local: "契稅"
        item_en: "Deed tax"
        typical_pct: "~0.6% of assessed value"
      - item_local: "印花稅"
        item_en: "Stamp tax"
        typical_pct: "0.1%"
      - item_local: "登記規費"
        item_en: "Registration fee"
        typical_pct: "0.1%"

building_risks:
  - key: pre_1999_seismic
    condition: "Year built < 1999"
    severity: medium
    flag_local: "921 前建物：建議確認結構安全鑑定"
    flag_en: "Pre-921 earthquake building: verify structural safety certification"
    viewing_action: "Ask for structural safety assessment report; inspect columns and beams for cracks"
  - key: radiation_steel
    condition: "Year built 1982-1984"
    severity: high
    flag_local: "輻射屋風險期：須委託專業輻射檢測，此為最高優先"
    flag_en: "Radiation-contaminated steel risk period: professional radiation detection required, highest priority"
    viewing_action: "Request gamma-ray radiation detection report; if unavailable, commission independent testing"
  - key: chloride_concrete
    condition: "Year built 1980s-1990s"
    severity: medium
    flag_local: "海砂屋風險期：建議要求氯離子含量報告"
    flag_en: "Chloride-contaminated concrete risk period: request chloride ion content report"
    viewing_action: "Request chloride ion content report; inspect ceiling for exposed rebar rust stains"

transport:
  systems:
    - key: mrt
      name_local: "捷運"
      name_en: "MRT"
    - key: bus
      name_local: "公車"
      name_en: "Bus"

address_normalization:
  rules:
    - description: "Traditional to simplified form"
      from: "臺"
      to: "台"
    - description: "Floor suffix normalisation"
      examples: "3F / 三樓 / 3樓 → 3F"
    - description: "Subdivision strip"
      examples: "1之3號 → 1號"
      note: "Strip 之 subdivisions"
    - description: "Full-width to half-width"
      examples: "３Ｆ → 3F"
    - description: "Space removal"
      examples: "Remove all spaces"

market_reference:
  price_register:
    name_local: "實價登錄"
    name_en: "Real Price Registration"
    url: "https://lvr.land.moi.gov.tw"
    lookback_months: 6
    description: "Government-mandated transaction price disclosure system"
  key_metrics:
    - key: rent_per_area
      label_local: "月租/坪"
      label_en: "Monthly rent per ping"
    - key: buy_per_area
      label_local: "總價/坪"
      label_en: "Total price per ping"
  reference_districts:
    premium: ["大安區", "信義區"]
    mid_range: ["萬華區", "中山區"]

portals:
  - name: "591 租屋"
    type: rent
    access_method: spa_playwright
    url_template: "https://rent.591.com.tw/?region={region_code}&section={section_codes}&rentprice=0,{rent_max}&area={size_min},"
  - name: "591 買屋"
    type: buy
    access_method: spa_playwright
    url_template: "https://sale.591.com.tw/?region={region_code}&price=0,{buy_max}&area={size_min},"
  - name: "樂屋網"
    type: buy
    access_method: spa_playwright
    base_url: "https://www.rakuya.com.tw/sell/search"
  - name: "信義房屋"
    type: buy
    access_method: spa_playwright
    base_url: "https://www.sinyi.com.tw/buy/list"
  - name: "永慶房屋"
    type: buy
    access_method: spa_playwright
    base_url: "https://www.yungching.com.tw/buy"
  - name: "東森房屋"
    type: buy
    access_method: spa_playwright
    base_url: "https://www.ethouse.com.tw/sell"
  - name: "住商不動產"
    type: buy
    access_method: spa_playwright
    base_url: "https://www.jjhouse.com.tw/sell"

rental_market:
  deposit_norm: "Typically 2 months rent as deposit (押金兩個月)"
  tenant_protections: null  # No formal RPZ-style protections in Taiwan

scoring:
  dimensions:
    - key: price_reasonableness
      name_local: "價格合理性"
      name_en: "Price Reasonableness"
      rent_weight: 30
      buy_weight: 35
    - key: space_layout
      name_local: "空間與格局"
      name_en: "Space & Layout"
      rent_weight: 20
      buy_weight: 20
    - key: location_amenities
      name_local: "區域生活機能"
      name_en: "Location & Amenities"
      rent_weight: 25
      buy_weight: 20
    - key: property_condition
      name_local: "物件條件"
      name_en: "Property Condition"
      rent_weight: 15
      buy_weight: 15
    - key: risk_upside
      name_local: "風險/潛力"
      name_en: "Risk / Upside"
      rent_weight: 10
      buy_weight: 10
  interpretation:
    excellent:
      threshold: 4.0
      label_local: "推薦看屋"
      label_en: "Recommended for viewing"
    moderate:
      threshold: 3.5
      label_local: "持保留態度"
      label_en: "Worth considering with caveats"
    poor:
      threshold: 0
      label_local: "建議跳過"
      label_en: "Recommend skipping"

