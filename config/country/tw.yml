onboarding:
  prompts:
    search_mode: "您想找 **租屋**、**買屋**，還是 **兩者都有**？"
    region_budget: |
      您的目標城市和區域是哪裡？預算多少？
      - 租屋：月租上限（TWD）
      - 買屋：總價上限（TWD），以及每月可負擔的房貸金額
    commute: "您的通勤目的地是哪裡？（公司地址、學校、或主要地標 — 用於篩選通勤時間。）您能接受的最長通勤時間是幾分鐘？"
    first_time_supplement: null  # No additional questions beyond standard onboarding for first_time in TW
    upgrader_supplement: |
      因為您是換屋族，我需要瞭解您目前物件的幾個細節，以便進行時程與稅務試算：
      - 目前物件預估市值（TWD）
      - 未還房貸餘額（TWD）
      - 購入年份
      - 換屋策略：先賣再買、先買再賣、同步進行？

listing_detection:
  rent_signals:
    - "月租"
    - "月租金"
    - "月付"
    - "押金"
  buy_signals:
    - "總價"

visit_checklist:
  universal:
    - key: water_leak
      item_local: "漏水痕跡"
      item_en: "Water leak traces"
      check_local: "天花板、牆面（尤其是家具背後）、窗框周圍、浴室"
      check_en: "Ceiling, walls (especially behind furniture), window frames, bathroom"
    - key: mobile_signal
      item_local: "手機訊號"
      item_en: "Mobile signal"
      check_local: "各個房間、廚房、衛浴都要確認訊號強度"
      check_en: "Check signal strength in every room, kitchen, bathroom"
    - key: natural_light
      item_local: "採光實測"
      item_en: "Natural light test"
      check_local: "開所有窗簾，各房間白天採光情況；注意遮擋物（鄰棟/廣告招牌）"
      check_en: "Open all curtains, check daytime light in each room; note obstructions (adjacent buildings, signs)"
    - key: sound_insulation
      item_local: "隔音測試"
      item_en: "Sound insulation test"
      check_local: "靜下來聽：鄰居聲、馬路噪音、電梯運轉聲"
      check_en: "Listen quietly: neighbour noise, road noise, elevator operation"
    - key: management_committee
      item_local: "管委會 / 管理"
      item_en: "Management committee"
      check_local: "是否有管委會？月費多少？可否索取近期會議記錄？"
      check_en: "Is there a management committee? Monthly fee? Can you get recent meeting minutes?"
    - key: water_heater
      item_local: "熱水器"
      item_en: "Water heater"
      check_local: "類型（瓦斯/電熱/太陽能）、年份、上次保養時間"
      check_en: "Type (gas/electric/solar), age, last service date"
    - key: plumbing
      item_local: "水管/排水"
      item_en: "Plumbing / drainage"
      check_local: "同時開所有水龍頭，沖馬桶，觀察排水速度"
      check_en: "Turn on all taps simultaneously, flush toilet, observe drainage speed"
    - key: doors_windows
      item_local: "門窗密封"
      item_en: "Door and window sealing"
      check_local: "開關每扇門窗，確認密封條完整、無異音、鎖具正常"
      check_en: "Open and close every door/window, check seals, no unusual sounds, locks functioning"
    - key: elevator
      item_local: "電梯（如有）"
      item_en: "Elevator (if present)"
      check_local: "實際搭乘，確認運作狀況、噪音、速度"
      check_en: "Ride it; check operation, noise, speed"
    - key: parking
      item_local: "停車位（如有）"
      item_en: "Parking (if present)"
      check_local: "確認位置、尺寸、使用方式"
      check_en: "Confirm location, size, access method"
  logistics: "攜帶：身分證、印章（以防需要）、相機。建議早上或中午看屋（確認採光，避免房東刻意營造的夜間照明）。帶捲尺量重要空間。確認：垃圾收集時間、停車規則、鄰居概況。"
