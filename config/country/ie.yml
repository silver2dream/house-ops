onboarding:
  prompts:
    search_mode: "Are you looking to **rent**, **buy**, or **both**?"
    region_budget: |
      Which counties, cities, or areas are you targeting? And what's your budget?
      - For rent: monthly ceiling in EUR
      - For buy: total price ceiling in EUR, and your gross annual income (for Central Bank lending rules)
    commute: "Where do you commute to? (Work address, office, or landmark -- used to filter by commute time.) What's the maximum commute you'd accept in minutes?"
    first_time_supplement: |
      Since you're a first-time buyer, a few extra questions:
      - Are you eligible for Help to Buy (HTB)? (New build or self-build only)
      - Are you interested in the First Home Scheme (shared equity)?
      - Gross annual income (for Central Bank 4x income rule)
    upgrader_supplement: |
      Since you're moving from an existing property:
      - Estimated current market value (EUR)
      - Outstanding mortgage balance (EUR)
      - Year you purchased it
      - Strategy: sell first, buy first, or simultaneous?

