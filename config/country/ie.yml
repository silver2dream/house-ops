  dimensions:
    - key: price_reasonableness
      name_local: "Price Reasonableness"
      name_en: "Price Reasonableness"
      rent_weight: 30
      buy_weight: 35
    - key: space_layout
      name_local: "Space & Layout"
      name_en: "Space & Layout"
      rent_weight: 20
      buy_weight: 20
    - key: location_amenities
      name_local: "Location & Amenities"
      name_en: "Location & Amenities"
