# Ireland Country Configuration — ie-house-ops
# All country-specific content extracted into structured YAML.
# This file is part of the SYSTEM LAYER and may be updated by system updates.

meta:
  code: ie
  name: Ireland
  name_local: "Ireland"
  language: en

market:
  currency: EUR
  currency_symbol: "\u20AC"
  area_unit: sqm
  area_unit_symbol: "m\xB2"
  area_to_sqm: 1
  price_per_area_label: "/m\xB2"
  rent_period_label: "/month"

regions:
  structure: "county > city/town > area/neighbourhood. Dublin uses postal districts (D1-D24, D6W). Eircode for precise location."
  region_codes: null  # Irish portals do not use numeric region codes

property_types:
  include:
    - key: apartment
      name_local: "Apartment"
      name_en: "Apartment"
    - key: house
      name_local: "House"
      name_en: "House"
    - key: terraced
      name_local: "Terraced house"
      name_en: "Terraced house"
    - key: semi_detached
      name_local: "Semi-detached house"
      name_en: "Semi-detached house"
    - key: detached
      name_local: "Detached house"
      name_en: "Detached house"
    - key: bungalow
      name_local: "Bungalow"
      name_en: "Bungalow"
    - key: duplex
      name_local: "Duplex"
      name_en: "Duplex"
    - key: studio
      name_local: "Studio"
      name_en: "Studio"
  exclude:
    - name_local: "Commercial"
      name_en: "Commercial"
    - name_local: "Industrial"
      name_en: "Industrial"
    - name_local: "Site / Land"
      name_en: "Site / Land"
    - name_local: "Parking space"
      name_en: "Parking space"

mortgage:
  scenarios:
    - key: ftb_fixed
      name: "First-Time Buyer Fixed"
      name_local: "First-Time Buyer Fixed"
      name_en: "First-Time Buyer Fixed"
      rate: 3.2
      down_payment: 0.10
      term_years: 30
      eligibility: "First-time buyer only. Central Bank rules: 4x gross annual income."
      max_loan: null  # Determined by income multiple, not a hard cap
    - key: ftb_variable
      name: "First-Time Buyer Variable"
      name_local: "First-Time Buyer Variable"
      name_en: "First-Time Buyer Variable"
      rate: 3.8
      down_payment: 0.10
      term_years: 30
      eligibility: "First-time buyer only. Central Bank rules: 4x gross annual income."
      max_loan: null
    - key: non_ftb_fixed
      name: "Non-FTB Fixed"
      name_local: "Non-FTB Fixed"
      name_en: "Non-FTB Fixed (mover)"
      rate: 3.2
      down_payment: 0.20
      term_years: 30
      eligibility: "Non-first-time buyer. Central Bank rules: 3.5x gross annual income."
      max_loan: null
    - key: non_ftb_variable
      name: "Non-FTB Variable"
      name_local: "Non-FTB Variable"
      name_en: "Non-FTB Variable (mover)"
      rate: 3.8
      down_payment: 0.20
      term_years: 30
      eligibility: "Non-first-time buyer. Central Bank rules: 3.5x gross annual income."
      max_loan: null
  affordability:
    income_field: "finance.annual_income"
    income_period: annual
    payment_ceiling_pct: null  # Ireland uses income multiples, not payment-to-income ratio
    income_multiple: 4  # FTB: 4x, non-FTB: 3.5x (differentiated by buyer_type)
    income_multiples_by_type:
      first_time_buyer: 4.0
      mover: 3.5
  buyer_types:
    - key: renter
      name_local: "Renter"
      name_en: "Renter"
    - key: first_time_buyer
      name_local: "First-time buyer"
      name_en: "First-time buyer"
    - key: mover
      name_local: "Mover"
      name_en: "Mover (non-FTB)"

government_schemes:
  - key: help_to_buy
    name_local: "Help to Buy (HTB)"
    name_en: "Help to Buy"
    description: "Tax refund for first-time buyers purchasing or self-building a new home. Up to EUR 30,000 or 10% of purchase price (whichever is lower)."
    max_amount: 30000
    eligibility: "First-time buyer; new build or self-build only; property value up to EUR 500,000."
    profile_field: "finance.htb_eligible"
  - key: first_home_scheme
    name_local: "First Home Scheme"
    name_en: "First Home Scheme"
    description: "Government and participating banks take a shared equity stake of up to 30% in the property, reducing the buyer's mortgage and deposit requirement."
    max_equity_pct: 30
    eligibility: "First-time buyer; new build only; income and property price caps apply."
    profile_field: "finance.fhs_eligible"
  - key: local_authority_affordable
    name_local: "Local Authority Affordable Purchase"
    name_en: "Local Authority Affordable Purchase"
    description: "Discounted homes sold through local authorities with an equity share retained by the council."
    eligibility: "Income thresholds vary by local authority; first-time buyer or qualifying applicant."
    profile_field: null

taxes:
  capital_gains:
    name_local: "Capital Gains Tax (CGT)"
    name_en: "Capital Gains Tax"
    holding_periods: []  # No holding-period tiering in Ireland; flat rate applies
    flat_rate: 33
    exemptions:
      - key: ppr
        name_local: "Principal Private Residence (PPR) relief"
        name_en: "PPR exemption"
        description: "No CGT on the sale of your principal private residence."
    annual_exemption: 1270  # EUR 1,270 annual CGT exemption per individual
  stamp_duty:
    name_local: "Stamp Duty"
    name_en: "Stamp Duty"
    rates:
      - threshold: 1000000
        rate: 1
        label: "1% on first EUR 1M"
      - threshold: null
        rate: 2
        label: "2% on balance above EUR 1M"
  property_tax:
    description: "Local Property Tax (LPT) — annual tax based on market value of the property, self-assessed. Rates set by each local authority."
    name_local: "Local Property Tax (LPT)"
    name_en: "Local Property Tax"
  transaction_costs:
    estimate_pct: 3
    breakdown:
      - item_local: "Stamp duty"
        item_en: "Stamp duty"
        typical_pct: "1-2%"
      - item_local: "Solicitor fees"
        item_en: "Solicitor (conveyancing) fees"
        typical_pct: "EUR 2,000-4,000 typical"
      - item_local: "Surveyor / valuation"
        item_en: "Surveyor and property valuation"
        typical_pct: "EUR 300-600"
      - item_local: "Land Registry fees"
        item_en: "Land Registry fees"
        typical_pct: "EUR 400-800"

building_risks:
  - key: asbestos
    condition: "Year built pre-1970s"
    severity: high
    flag_local: "Pre-1970s: asbestos risk in insulation, ceiling tiles, pipe lagging"
    flag_en: "Pre-1970s: asbestos risk in insulation, ceiling tiles, pipe lagging"
    viewing_action: "Commission an asbestos survey before purchase; do not disturb suspect materials"
  - key: pyrite
    condition: "Located in North Dublin, North Leinster, or Meath"
    severity: high
    flag_local: "Pyrite risk area (North Dublin / Leinster): check for heave damage in foundations and floors"
    flag_en: "Pyrite risk area (North Dublin / Leinster): check for heave damage in foundations and floors"
    viewing_action: "Request pyrite assessment report (IS 398); check for cracked floors, uneven surfaces, door frames out of alignment"
  - key: mica
    condition: "Located in Donegal or Mayo"
    severity: high
    flag_local: "Mica-affected area (Donegal / Mayo): defective concrete blocks causing structural cracking"
    flag_en: "Mica-affected area (Donegal / Mayo): defective concrete blocks causing structural cracking"
    viewing_action: "Request a mica testing report; inspect exterior walls for cracking patterns; verify if remediation has been done"
  - key: no_ber
    condition: "No BER certificate provided"
    severity: medium
    flag_local: "No BER certificate: energy performance unknown, legally required for sale/rent"
    flag_en: "No BER certificate: energy performance unknown, legally required for sale/rent"
    viewing_action: "Request BER cert before proceeding; absence may indicate poor energy rating or non-compliance"
  - key: unauthorised_extension
    condition: "Extension or conversion without planning permission"
    severity: high
    flag_local: "Unauthorised extension: may not be covered by insurance, affects resale and mortgage approval"
    flag_en: "Unauthorised extension: may not be covered by insurance, affects resale and mortgage approval"
    viewing_action: "Request planning permission records and commencement notice; verify with local authority"

transport:
  systems:
    - key: luas_green
      name_local: "Luas (Green Line)"
      name_en: "Luas Green Line"
    - key: luas_red
      name_local: "Luas (Red Line)"
      name_en: "Luas Red Line"
    - key: dart
      name_local: "DART"
      name_en: "DART (Dublin Area Rapid Transit)"
    - key: dublin_bus
      name_local: "Dublin Bus"
      name_en: "Dublin Bus"
    - key: irish_rail
      name_local: "Irish Rail"
      name_en: "Irish Rail"

address_normalization:
  rules:
    - description: "Road suffix normalisation"
      examples: "Road / Rd / Rd. -> Rd"
    - description: "Street suffix normalisation"
      examples: "Street / St / St. -> St"
    - description: "Avenue suffix normalisation"
      examples: "Avenue / Ave / Ave. -> Ave"
    - description: "Dublin postal district normalisation"
      examples: "Dublin 2 / D2 / D02 -> D2"
    - description: "Case-insensitive matching"
      examples: "RANELAGH / Ranelagh / ranelagh -> ranelagh"

market_reference:
  price_register:
    name_local: "Property Price Register"
    name_en: "Property Price Register"
    url: "https://www.propertypriceregister.ie"
    lookback_months: 6
    description: "Statutory register of residential property sale prices in Ireland"
  key_metrics:
    - key: rent_per_area
      label_local: "Rent per m\xB2 per month"
      label_en: "Rent per sqm per month"
    - key: buy_per_area
      label_local: "Price per m\xB2"
      label_en: "Price per sqm"
  ber_ratings:
    description: "Building Energy Rating from A1 (most efficient) to G (least efficient). Affects energy costs and resale value."
    scale: ["A1", "A2", "A3", "B1", "B2", "B3", "C1", "C2", "C3", "D1", "D2", "E1", "E2", "F", "G"]
    good_threshold: "B3"  # B3 or better is considered good
    note: "BER cert is legally required for sale or rental listings"

portals:
  - name: "Daft.ie"
    type: both
    access_method: standard_web
    base_url: "https://www.daft.ie"
  - name: "MyHome.ie"
    type: both
    access_method: standard_web
    base_url: "https://www.myhome.ie"
  - name: "Property.ie"
    type: both
    access_method: standard_web
    base_url: "https://www.property.ie"

rental_market:
  deposit_norm: "Typically 1 month rent as deposit"
  tenant_protections: |
    Rent Pressure Zones (RPZ): rent increases capped at 2% per year in designated areas.
    Residential Tenancies Board (RTB): mandatory registration of all tenancies; dispute resolution.
    HAP (Housing Assistance Payment): local authority rental subsidy for qualifying tenants.
    Minimum notice periods based on tenancy duration. Part 4 tenancy rights after 6 months.

