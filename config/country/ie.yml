    - "to let"
    - "to rent"
  buy_signals:
    - "asking price"
    - "price on application"
    - "guide price"
    - "for sale"
    - "AMV"

visit_checklist:
  universal:
    - key: dampness
      item_local: "Dampness / damp"
      item_en: "Dampness and damp"
      check_local: "Check walls, ceilings (especially corners), around windows, and under sinks for damp patches, mould, or musty smells"
      check_en: "Check walls, ceilings (especially corners), around windows, and under sinks for damp patches, mould, or musty smells"
    - key: mobile_signal
      item_local: "Mobile signal"
      item_en: "Mobile signal"
      check_local: "Check signal strength in every room, kitchen, bathroom"
      check_en: "Check signal strength in every room, kitchen, bathroom"
    - key: natural_light
      item_local: "Natural light"
      item_en: "Natural light"
      check_local: "Open all curtains/blinds; check daytime light in each room; note which direction windows face"
      check_en: "Open all curtains/blinds; check daytime light in each room; note which direction windows face"
    - key: sound_insulation
      item_local: "Noise levels"
      item_en: "Noise levels"
      check_local: "Listen for neighbour noise, road traffic, flight paths; check soundproofing between units"
      check_en: "Listen for neighbour noise, road traffic, flight paths; check soundproofing between units"
    - key: management_company
      item_local: "Management company"
      item_en: "Management company / OMC"
      check_local: "Is there an Owners' Management Company? Annual service charge? Sinking fund status? Any planned levies?"
      check_en: "Is there an Owners' Management Company? Annual service charge? Sinking fund status? Any planned levies?"
    - key: heating
      item_local: "Heating system"
      item_en: "Heating system"
      check_local: "Type (gas / oil / electric / heat pump); age of boiler; last service date; BER rating implications"
      check_en: "Type (gas / oil / electric / heat pump); age of boiler; last service date; BER rating implications"
    - key: plumbing
      item_local: "Plumbing / drainage"
      item_en: "Plumbing and drainage"
      check_local: "Run taps and flush toilets; check water pressure; look for signs of old lead pipes"
      check_en: "Run taps and flush toilets; check water pressure; look for signs of old lead pipes"
    - key: doors_windows
      item_local: "Windows and doors"
      item_en: "Windows and doors"
      check_local: "Double or triple glazing? Open and close all windows/doors; check seals, draughts, and locks"
      check_en: "Double or triple glazing? Open and close all windows/doors; check seals, draughts, and locks"
    - key: lift
      item_local: "Lift (if apartment)"
      item_en: "Lift / elevator (if apartment)"
      check_local: "Ride it; check operation and speed; note if it serves all floors"
      check_en: "Ride it; check operation and speed; note if it serves all floors"
    - key: parking
      item_local: "Parking"
      item_en: "Parking"
      check_local: "Designated space? On-street permit needed? Visitor parking availability?"
      check_en: "Designated space? On-street permit needed? Visitor parking availability?"
  logistics: "Bring: photo ID, phone/camera, tape measure. Visit during daylight hours to assess natural light and neighbourhood. Check broadband availability (SIRO/NBI map). Note bin collection day, local amenities, nearest public transport stop."
