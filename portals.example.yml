# ie-house-ops Portal Configuration
# Copy this file to portals.yml. It will be auto-copied during onboarding.
# portals.yml is in the SYSTEM LAYER — it may be updated by system updates.
# Add custom portals to tracked_portals and adjust title_filter for your needs.

title_filter:
  property_types:
    include: ["apartment", "semi-detached", "detached", "terraced", "townhouse", "bungalow"]
    exclude: ["site", "commercial", "industrial"]
  price:
    rent_max: 4000        # Loose scanner ceiling — profile.yml has the precise value
    buy_max: 1000000
  size_min: 30            # Loose scanner floor (m²)

tracked_portals:
  # Daft.ie — dominant Irish property portal
  - name: "Daft.ie Rent"
    type: rent
    enabled: true
    url_template: "https://www.daft.ie/property-for-rent/{county}?rentalPrice_to={rent_max}&floorArea_from={size_min}"

  - name: "Daft.ie Buy"
    type: buy
    enabled: true
    url_template: "https://www.daft.ie/property-for-sale/{county}?salePrice_to={buy_max}&floorArea_from={size_min}"

  # MyHome.ie — Irish Times property portal
  - name: "MyHome.ie Buy"
    type: buy
    enabled: true
    base_url: "https://www.myhome.ie/residential/search"

  # Property.ie
  - name: "Property.ie Buy"
    type: buy
    enabled: true
    base_url: "https://www.property.ie/property-for-sale/"

  # SherryFitzGerald — major Irish estate agent
  - name: "SherryFitzGerald"
    type: buy
    enabled: true
    base_url: "https://www.sherryfitz.ie/buy"

  # Lisney — Dublin/Cork/Belfast estate agent
  - name: "Lisney"
    type: buy
    enabled: true
    base_url: "https://www.lisney.com/residential/sale"

market_reference:
  ppr:
    enabled: true
    use_for: price_comparison   # Never populates pipeline — only injected into evaluation reports

search_queries:                 # WebSearch broad discovery
  - name: "Daft rent discovery"
    query: "site:daft.ie {areas} to rent {rent_max}"
    enabled: true
  - name: "Daft buy discovery"
    query: "site:daft.ie {areas} for sale {buy_max}"
    enabled: true
  - name: "MyHome buy discovery"
    query: "site:myhome.ie {areas} for sale"
    enabled: true
